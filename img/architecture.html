        <title id="arch-title">Playbook runner architecture</title>
        <desc id="arch-desc">
          A browser talks over HTTPS to the Caddy gateway, the only published
          port. The gateway sends /rpc, /api, /scalar and /openapi.json to the
          Hono backend and every other path to the Astro SSR frontend. The
          backend reads and writes PostgreSQL via Drizzle ORM and calls the
          Ansible executor over gRPC through the gateway's internal router on
          port 50050, which forwards the run package to the executor on port
          50051 and streams RunEvents back.
        </desc>
