<?xml version="1.0" encoding="UTF-8"?>
<svg
        viewBox="0 0 1280 720"
        role="img"
        aria-labelledby="arch-title arch-desc"
        xmlns="http://www.w3.org/2000/svg"
      >
        <title id="arch-title">Playbook runner architecture</title>
        <desc id="arch-desc">
          A browser talks to the Astro SSR frontend over HTTPS. The frontend
          proxies /rpc and /api calls to the Hono backend, which reads and
          writes PostgreSQL via Drizzle ORM and initiates a gRPC connection to
          the Ansible executor on port 50051 for streamed RunEvents. The
          executor opens a separate gRPC channel back to the backend on port
          50052 for ping diagnostics.
        </desc>

