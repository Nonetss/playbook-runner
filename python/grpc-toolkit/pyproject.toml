[project]
name = "grpc-toolkit"
version = "0.1.0"
description = "Shared gRPC server bootstrap (auth interceptor, codegen path shim) for the ansible service"
requires-python = ">=3.12"
dependencies = ["grpcio>=1.68.0", "loguru>=0.7.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grpc_toolkit"]

[tool.ruff.lint]
extend-select = ["I"]
