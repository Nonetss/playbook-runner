name: Ansible Vault necesita la contraseña del repositorio
area: disponibilidad
effect: Un !vault solo se descifra en un playbook de Git cuyo repositorio tiene la contraseña; si no, falla con Attempt to use undecryptable variable
do: Poner la contraseña en el formulario del repositorio, o usar secretos de Infisical
checked: probado
page: ejecucion/variables
