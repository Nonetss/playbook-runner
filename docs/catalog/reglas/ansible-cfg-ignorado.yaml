name: ansible.cfg solo aplica tiempos y reintentos
area: disponibilidad
effect: En Git, ANSIBLE_CONFIG apunta a un fichero del runner que copia del ansible.cfg más cercano solo unos tiempos, reintentos y gathering; plugins, rutas, forks y ssh_args no valen, y de inventory solo se usan sus variables
do: Poner los roles en un roles/ del árbol y dejar en ansible.cfg solo esos tiempos; una variable ANSIBLE_ del runner gana a lo que declare
checked: leido
page: ejecucion/materializacion
