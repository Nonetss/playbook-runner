# Codegen for the TypeScript side of the shared contracts in `proto/`.
# Mirrors what `grpc_tools.protoc` does for the Python side: output goes to
# `src/gen/`, which is gitignored and regenerated by `bun run generate-grpc`.
#
# `snakeToCamel=false` keeps field names identical to the .proto (and to the
# Python stubs), so `from_service` stays `from_service` on both sides.
version: v2
plugins:
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: src/gen
    opt:
      - outputServices=grpc-js
      - env=node
      - esModuleInterop=true
      - useOptionals=messages
      - snakeToCamel=false
