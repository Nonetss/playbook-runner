syntax = "proto3";

package run;

// Called by the backend to execute an already-resolved selection: the
// backend resolves the playbook/hosts/script/device against its own
// database (`packages/api/src/v1/run/handler.ts`, the same logic the job
// scheduler uses) and streams the run over one of these RPCs. Ansible itself
// never touches the database or a user session — it only executes.
service RunnerService {
  rpc RunBundle(RunBundleRequest) returns (stream RunBundleResponse);
  rpc RunPing(RunPingRequest) returns (stream RunPingResponse);
  rpc RunCommand(RunCommandRequest) returns (stream RunCommandResponse);
  rpc RunScript(RunScriptRequest) returns (stream RunScriptResponse);
  // Fetch a Git repository into the runner's mirror cache and report the
  // branch head plus the playbook files discovered at that commit.
  rpc SyncRepository(SyncRepositoryRequest) returns (SyncRepositoryResponse);
  // List the branches of a remote (no mirror involved), to pick one in the UI.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  // List the Ansible roles and dependency files of a repository at a commit.
  rpc ListRepositoryRoles(ListRepositoryRolesRequest) returns (ListRepositoryRolesResponse);
  rpc ListPlaybookVariables(ListPlaybookVariablesRequest) returns (ListPlaybookVariablesResponse);
  // Drop a repository's mirror cache (the repository was deleted).
  rpc DeleteRepository(DeleteRepositoryRequest) returns (DeleteRepositoryResponse);
  // List a project's environments, to pick one in the UI. Empty when the
  // Infisical instance does not provide them.
  rpc ListInfisicalEnvironments(ListInfisicalEnvironmentsRequest) returns (ListInfisicalEnvironmentsResponse);
  // List the secret names at an environment and path. Never carries values.
  rpc ListInfisicalSecretNames(ListInfisicalSecretNamesRequest) returns (ListInfisicalSecretNamesResponse);
}

message Host {
  string name = 1;
  string address = 2;
  optional int32 port = 3;
  string username = 4;
  string private_key = 5;
  string connection = 6; // "ssh"
}

message Playbook {
  string name = 1;
  string content = 2;
  // Set for Git-sourced playbooks: the runner exports the repository at
  // `commit` and runs `path` from that tree instead of writing `content`.
  optional GitSource git = 3;
}

message GitSource {
  string repository_id = 1;
  string url = 2;
  string commit = 3;
  string path = 4;
  optional string private_key = 5;
}

message Script {
  string name = 1;
  string content = 2;
  string language = 3; // "bash" | "python"
}

// Universal Auth credentials the runner authenticates to Infisical with.
message InfisicalAuth {
  string url = 1;
  string client_id = 2;
  string client_secret = 3;
}

// One playbook variable and the secret that fills it.
message SecretVariable {
  string name = 1;
  string secret_name = 2;
  string secret_path = 3;
}

// What the runner fetches before starting Ansible. Only references: values
// never cross this boundary.
message SecretVariables {
  InfisicalAuth auth = 1;
  string project_id = 2;
  string environment = 3;
  repeated SecretVariable variables = 4;
}

message RunBundleRequest {
  Playbook playbook = 1;
  repeated Host hosts = 2;
  int32 forks = 3;
  map<string, string> extravars = 4;
  reserved 5;
  optional SecretVariables secret_variables = 6;
  // Roles left without tasks in this run's copy of a Git playbook's tree.
  repeated string disabled_roles = 7;
}

message RunPingRequest {
  Host host = 1;
}

message RunCommandRequest {
  repeated Host hosts = 1;
  string module = 2; // "shell" | "command"
  string command = 3;
  bool become = 4;
  int32 forks = 5;
}

message RunScriptRequest {
  Script script = 1;
  repeated Host hosts = 2;
  bool become = 3;
  int32 forks = 4;
}

message SyncRepositoryRequest {
  string repository_id = 1;
  string url = 2;
  string branch = 3;
  string subdir = 4; // "" = repository root
  optional string private_key = 5;
}

message PlaybookFile {
  string path = 1; // relative to the repository root
  string content = 2;
}

message SyncRepositoryResponse {
  string commit = 1;
  repeated PlaybookFile playbooks = 2;
}

message ListRepositoryRolesRequest {
  string repository_id = 1;
  string url = 2;
  string commit = 3;
  string subdir = 4; // "" = repository root
  optional string private_key = 5;
}

message RepositoryRole {
  string name = 1;
  string path = 2; // relative to the repository root
  optional string description = 3;
}

// Roles a playbook declares, following its import_playbook files. Only playbooks
// declaring some are listed.
message PlaybookRoles {
  string path = 1; // relative to the repository root
  repeated string roles = 2;
  // It also uses a role or import whose name is only known when it runs.
  bool dynamic = 3;
}

// A variable a playbook defines. `role` is unset when it comes from the play.
message PlaybookVariable {
  string name = 1;
  // Unset when it is not a plain value, or looks sensitive.
  optional string value = 2;
  optional string role = 3;
}

// Only playbooks defining some are listed.
message PlaybookVariables {
  string path = 1; // relative to the repository root
  repeated PlaybookVariable variables = 2;
}

// The variables a single-file playbook defines: its plays' `vars`.
message ListPlaybookVariablesRequest {
  string content = 1;
}

message ListPlaybookVariablesResponse {
  repeated PlaybookVariable variables = 1;
}

message ListRepositoryRolesResponse {
  repeated RepositoryRole roles = 1;
  // `requirements.yml` files found; their dependencies are not installed.
  repeated string requirements_files = 2;
  repeated PlaybookRoles playbook_roles = 3;
  repeated PlaybookVariables playbook_variables = 4;
}

message ListBranchesRequest {
  string url = 1;
  optional string private_key = 2;
}

message ListBranchesResponse {
  repeated string branches = 1;
  string default_branch = 2; // "" when the remote HEAD is unknown
}

message DeleteRepositoryRequest {
  string repository_id = 1;
}

message DeleteRepositoryResponse {}

message ListInfisicalEnvironmentsRequest {
  InfisicalAuth auth = 1;
  string project_id = 2;
}

message InfisicalEnvironment {
  string slug = 1;
  string name = 2;
}

message ListInfisicalEnvironmentsResponse {
  repeated InfisicalEnvironment environments = 1;
}

message ListInfisicalSecretNamesRequest {
  InfisicalAuth auth = 1;
  string project_id = 2;
  string environment = 3;
  string secret_path = 4;
}

message ListInfisicalSecretNamesResponse {
  repeated string names = 1;
}

// Each RPC has its own response type because Buf requires request and response
// messages to be used by only one RPC. Exactly one payload is set per frame,
// mirroring the `event`/`done`/`error` SSE frames
// `app/services/ansible/sse.py` used to emit.
message RunBundleResponse {
  oneof payload {
    TaskEvent task = 1;
    Done done = 2;
    string error = 3;
    Heartbeat heartbeat = 4;
  }
}

message RunPingResponse {
  oneof payload {
    TaskEvent task = 1;
    Done done = 2;
    string error = 3;
    Heartbeat heartbeat = 4;
  }
}

message RunCommandResponse {
  oneof payload {
    TaskEvent task = 1;
    Done done = 2;
    string error = 3;
    Heartbeat heartbeat = 4;
  }
}

message RunScriptResponse {
  oneof payload {
    TaskEvent task = 1;
    Done done = 2;
    string error = 3;
    Heartbeat heartbeat = 4;
  }
}

// A single ansible-runner event, reduced to the fields the backend persists
// (mirrors `event_payload()` in `app/services/ansible/sse.py`).
message TaskEvent {
  string event = 1;
  optional string host = 2;
  optional string play = 3;
  optional string task = 4;
  optional string task_action = 5;
  optional bool changed = 6;
  optional string msg = 7;
  optional string stdout = 8;
  optional string stderr = 9;
  optional int32 rc = 10;
  // Only set on the `playbook_on_stats` event.
  optional Stats stats = 11;
}

// Per-host recap counters, host name -> count.
message Stats {
  map<string, int32> ok = 1;
  map<string, int32> changed = 2;
  map<string, int32> failures = 3;
  map<string, int32> dark = 4;
  map<string, int32> skipped = 5;
}

// Sent by the runner while a run has produced no other frame for
// `RUN_HEARTBEAT_INTERVAL_S`, so a long silent task never leaves the stream
// idle (HTTP/2 pings don't cross the gateway; DATA frames do). Transport-only:
// the backend drops it and it never reaches the browser or the database.
message Heartbeat {}

// Terminal frame once the run finishes (no more TaskEvents follow).
message Done {
  string status = 1;
  int32 rc = 2;
  bool ok = 3;
}
